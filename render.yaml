services:
  - type: web
    name: universolab-provalab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PROVALAB_ACCESS_TOKEN
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: PROVALAB_ALLOWED_ORIGINS
        value: https://jatnielribeiro.github.io
